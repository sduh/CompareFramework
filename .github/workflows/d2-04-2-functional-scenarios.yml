name: D2-04.2 functional scenarios T001-T010

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functional-scenarios:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install LibreOffice 7.4.7.2
        run: bash tools/ci/install_libreoffice_7_4_7_2.sh

      - name: Build current monolith
        run: python tools/build_monolith.py

      - name: Validate D2-04.2 static scenario contract
        run: PYTHONPATH=. python tests/test_d2_04_2_scenario_contract.py

      - name: Validate D2-04.2 pure runner helpers
        run: PYTHONPATH=. python tests/test_d2_04_2_runner_unit.py

      - name: Resolve PyUNO Python environment
        shell: bash
        run: |
          set -euo pipefail
          if [[ -x /opt/libreoffice7.4/program/python ]]; then
            echo "UNO_PYTHON=/opt/libreoffice7.4/program/python" >> "$GITHUB_ENV"
          else
            echo "UNO_PYTHON=$(command -v python3)" >> "$GITHUB_ENV"
            echo "PYTHONPATH=/opt/libreoffice7.4/program${PYTHONPATH:+:${PYTHONPATH}}" >> "$GITHUB_ENV"
            echo "LD_LIBRARY_PATH=/opt/libreoffice7.4/program${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> "$GITHUB_ENV"
          fi

      - name: Verify UNO Python bridge
        run: |
          "${UNO_PYTHON}" -c 'import uno; print("PyUNO import OK")'

      - name: Run reference structural-alert runtime regressions
        shell: bash
        run: |
          set -euo pipefail
          diagnostics_dir="build/d2-04-2"
          mkdir -p "${diagnostics_dir}"
          runtime_log="${diagnostics_dir}/reference-runtime.log"
          set +e
          (
            set -euo pipefail
            set -x
            monolith="$(find dist -maxdepth 1 -type f -name '*.bas' | sort | head -n 1)" || exit $?
            test -n "${monolith}" || exit $?
            export CF_MONOLITH="${monolith}"
            export CF_D2042_ARTIFACT_ROOT="${diagnostics_dir}/reference-runtime"
            set +x
            printf '%s\n' '[reference-runtime] unittest output begins'
            PYTHONPATH=".:${PYTHONPATH:-}" "${UNO_PYTHON}" \
              tests/test_d2_04_2_reference_runtime.py -v
          ) 2>&1 | tee "${runtime_log}"
          statuses=("${PIPESTATUS[@]}")
          set -e
          if (( statuses[0] != 0 || statuses[1] != 0 )); then
            runtime_tail="$(awk '/^\[reference-runtime\] unittest output begins$/ { capture = 1; next } capture { print }' "${runtime_log}" 2>/dev/null | tail -n 80 || true)"
            runtime_tail="${runtime_tail//%/%25}"
            runtime_tail="${runtime_tail//$'\r'/%0D}"
            runtime_tail="${runtime_tail//$'\n'/%0A}"
            printf '%s\n' "::error title=Reference runtime regression failed::${runtime_tail:-No runtime log available.}" || true
            if (( statuses[0] != 0 )); then
              exit "${statuses[0]}"
            fi
            exit "${statuses[1]}"
          fi

      - name: Provision French locale for typed-value runtime regression
        run: sudo locale-gen fr_FR.UTF-8

      - name: Run typed-value runtime regression under C and French locales
        run: |
          set -euo pipefail
          monolith="$(find dist -maxdepth 1 -type f -name '*.bas' | sort | head -n 1)"
          test -n "${monolith}"
          export CF_MONOLITH="${monolith}"
          for locale_name in C.UTF-8 fr_FR.UTF-8; do
            LC_ALL="${locale_name}" LANG="${locale_name}" \
              PYTHONPATH=".:${PYTHONPATH:-}" "${UNO_PYTHON}" tests/test_d2_04_2_typed_runtime.py
          done

      - name: Run T001-T010 through real LibreOffice and UNO
        run: |
          set -euo pipefail
          monolith="$(find dist -maxdepth 1 -type f -name '*.bas' | sort | head -n 1)"
          test -n "${monolith}"
          PYTHONPATH=".:${PYTHONPATH:-}" "${UNO_PYTHON}" -m tools.ci.run_functional_scenarios \
            --soffice "${SOFFICE_BIN}" \
            --monolith "${monolith}" \
            --datasets tests/datasets \
            --artifacts build/d2-04-2 \
            --timeout 60

      - name: Upload D2-04.2 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d2-04-2-functional-scenarios
          path: build/d2-04-2
          if-no-files-found: warn

      - name: Regenerate canonical architecture for API freeze guard
        run: PYTHONPATH=. python -m tools.architecture --root . --summary

      - name: Preserve D2-03.24 API freeze
        run: PYTHONPATH=. python tests/test_d2_03_24_public_api_freeze.py

name: D2-03.24 cumulative validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile architecture analyzer
        run: python -m compileall -q tools/architecture
      - name: Run cumulative Python regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Regenerate canonical architecture
        run: python -m tools.architecture --root . --summary
      - name: Verify D2-03.24 contract after regeneration
        run: python tests/test_d2_03_24_public_api_freeze.py
      - name: Build monolith
        run: python tools/build_monolith.py
